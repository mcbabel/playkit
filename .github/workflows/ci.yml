name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - run: cargo fmt --all --check
      - run: cargo build -p playkit-loader --release --target x86_64-pc-windows-gnu
      - name: Build the example native mod
        run: x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared -static -I crates/loader/sdk/include -o hello.dll crates/loader/examples/hello/hello.cpp
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

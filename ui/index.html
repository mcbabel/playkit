<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playkit</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="titlebar" data-tauri-drag-region>
  <span class="titlebar-name" data-tauri-drag-region>Playkit</span>
  <div class="wincontrols">
    <button class="winbtn" id="win-min" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="winbtn" id="win-max" aria-label="Maximize"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="winbtn winbtn-close" id="win-close" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</header>
<div class="shell">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 512 512"><path d="M88 144H184a48 48 0 1 1 96 0H376V232a48 48 0 1 1 0 96V416H88V328a48 48 0 1 0 0-96Z" fill="#1A1405" stroke="#1A1405" stroke-width="20" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="brand-name">Playkit</div>
      <div class="brand-sub">Mod launcher · unofficial</div>
    </div>
  </div>
  <nav class="nav" aria-label="Main" id="nav"></nav>
  <div class="game-card" id="game-card"></div>
</aside>
<main id="view" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>

[workspace]
resolver = "2"
members = ["crates/core", "crates/merge", "crates/pack", "crates/loader", "app"]
exclude = ["vendor/unreal_asset"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MCbabel/playkit"

[workspace.dependencies]
playkit-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
